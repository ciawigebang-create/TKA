        let currentChart = null;
        let currentActiveIndex = 0;

        function initSidebar() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            dataSoal.forEach((soal, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-5 py-3.5 md:py-3 text-sm hover:bg-blue-50 transition-colors border-l-4 border-transparent flex items-center justify-between nav-item`;
                btn.id = `nav-${soal.id}`;
                btn.innerHTML = `<span class="truncate pr-2">${soal.label}</span> <svg class="w-4 h-4 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                btn.onclick = () => loadSoal(index);
                container.appendChild(btn);
            });
        }

        function loadSoal(index) {
            if (index < 0 || index >= dataSoal.length) return;
            currentActiveIndex = index;
            const soal = dataSoal[index];

            // Update active state di sidebar
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('tab-active'));
            const activeBtn = document.getElementById(`nav-${soal.id}`);
            if (activeBtn) {
                activeBtn.classList.add('tab-active');
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            // Tutup menu mobile
            toggleMobileMenu(false);

            // Render Teks
            document.getElementById('soal-title').innerText = soal.title;
            document.getElementById('soal-badge').innerText = soal.topic;
            document.getElementById('soal-text').innerHTML = soal.text;
            
            const optionsContainer = document.getElementById('soal-options');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');
            
            soal.options.forEach(opt => {
                // Deteksi opsi jawaban
                const isMatch = (opt.letter === soal.answer) || (soal.answer.includes(opt.letter) && opt.letter.length === 1);
                
                const optDiv = document.createElement('div');
                optDiv.className = `p-3.5 border rounded-lg flex items-start transition-colors ${isMatch ? 'bg-green-50 border-green-300 shadow-sm' : 'bg-white border-gray-200 hover:border-blue-300'}`;
                optDiv.innerHTML = `
                    <span class="font-bold mr-3 ${isMatch ? 'text-green-700' : 'text-gray-600'} min-w-[20px]">${opt.letter}.</span>
                    <span class="${isMatch ? 'text-green-900 font-medium' : 'text-gray-700'} text-sm md:text-base">${opt.text}</span>
                `;
                optionsContainer.appendChild(optDiv);
            });

            document.getElementById('pembahasan-container').classList.remove('hidden');
            document.getElementById('correct-answer').innerText = soal.answerText;
            document.getElementById('pembahasan-text').innerHTML = soal.pembahasan;
            document.getElementById('chart-title').innerText = soal.chartConfig.title;

            // Render Chart
            if (currentChart) {
                currentChart.destroy();
            }

            const ctx = document.getElementById('mainChart').getContext('2d');
            const defaultOptions = {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 600, easing: 'easeOutQuart' },
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, font: {size: 11} } }
                }
            };

            const finalOptions = { ...defaultOptions, ...soal.chartConfig.options };
            if (soal.chartConfig.options.scales) finalOptions.scales = soal.chartConfig.options.scales;
            if (soal.chartConfig.options.plugins) finalOptions.plugins = { ...defaultOptions.plugins, ...soal.chartConfig.options.plugins };

            currentChart = new Chart(ctx, {
                type: soal.chartType,
                data: soal.chartConfig.data,
                options: finalOptions
            });

            // Update status tombol navigasi
            document.getElementById('btn-prev').disabled = (index === 0);
            document.getElementById('btn-next').disabled = (index === dataSoal.length - 1);
            
            // Auto scroll ke atas saat soal ganti
            const isMobile = window.innerWidth < 768;
            window.scrollTo({ top: isMobile ? 0 : 0, behavior: 'smooth' });
        }

        function toggleMobileMenu(show) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                document.body.style.overflow = 'hidden'; // cegah scroll background
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
                document.body.style.overflow = ''; // kembalikan scroll
            }
        }

        // Event Listeners
        document.getElementById('mobile-menu-btn').addEventListener('click', () => toggleMobileMenu(true));
        document.getElementById('close-sidebar-btn').addEventListener('click', () => toggleMobileMenu(false));
        document.getElementById('mobile-overlay').addEventListener('click', () => toggleMobileMenu(false));

        document.getElementById('btn-prev').addEventListener('click', () => loadSoal(currentActiveIndex - 1));
        document.getElementById('btn-next').addEventListener('click', () => loadSoal(currentActiveIndex + 1));

        // Init
        window.onload = () => {
            initSidebar();
            loadSoal(0);
        };
    </script>
